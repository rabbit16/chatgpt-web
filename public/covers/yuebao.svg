<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="余额兔封面">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="55%" stop-color="#f7f9ff"/>
      <stop offset="100%" stop-color="#f3efff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7ff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b7fff"/>
      <stop offset="100%" stop-color="#6f5cff"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="28" fill="url(#bg)"/>
  <g stroke="#2b7fff" stroke-opacity="0.12" fill="none">
    <ellipse cx="470" cy="120" rx="190" ry="76" transform="rotate(-16 470 120)"/>
    <ellipse cx="470" cy="120" rx="140" ry="52" transform="rotate(-16 470 120)"/>
  </g>

  <!-- 兔子 -->
  <g transform="translate(96 132)">
    <path d="M28 40c-6-26 2-40 10-40s12 14 10 34" fill="none" stroke="url(#ink)" stroke-width="7" stroke-linecap="round"/>
    <path d="M60 40c6-26 16-38 24-36s8 16 2 36" fill="none" stroke="url(#ink)" stroke-width="7" stroke-linecap="round"/>
    <rect x="14" y="38" width="82" height="78" rx="34" fill="#fff" stroke="url(#ink)" stroke-width="5"/>
    <circle cx="44" cy="74" r="5.5" fill="#2b7fff"/>
    <circle cx="76" cy="74" r="5.5" fill="#2b7fff"/>
    <path d="M56 88l5 5 5-5" fill="none" stroke="#2b7fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 92H8M96 92h14" stroke="#2b7fff" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 悬浮余额卡 -->
  <g transform="translate(300 108)">
    <rect width="272" height="186" rx="22" fill="url(#card)" stroke="#2b7fff" stroke-opacity="0.16"/>
    <text x="26" y="46" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#7b8794">账户余额</text>
    <text x="24" y="96" font-family="ui-monospace, SFMono-Regular, monospace" font-size="42" font-weight="600" fill="#101828">¥ 128.40</text>
    <line x1="26" y1="118" x2="246" y2="118" stroke="#2b7fff" stroke-opacity="0.12"/>
    <text x="26" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7b8794">今日消耗</text>
    <text x="26" y="168" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#101828">0.62 元</text>
    <text x="168" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7b8794">本月</text>
    <text x="168" y="168" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15" fill="#101828">18.90 元</text>
  </g>

  <text x="96" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="600" fill="#101828">余额兔</text>
  <text x="96" y="318" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#667085">常驻桌面，抬头就能看到余额与用量</text>
  <rect x="96" y="340" width="126" height="30" rx="15" fill="#2b7fff" fill-opacity="0.1"/>
  <text x="114" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#2b7fff">Windows · macOS</text>
</svg>
