<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="rabbitJ">
  <defs>
    <linearGradient id="rj-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b7fff"/>
      <stop offset="1" stop-color="#6aa9ff"/>
    </linearGradient>
  </defs>

  <!-- 底板：圆角方块，和全站卡片同一档圆角语言 -->
  <rect width="64" height="64" rx="17" fill="url(#rj-bg)"/>

  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左耳：直一些 -->
    <path d="M25.6 31.2c-3.1-6.2-4.7-11.6-4-14.9.5-2.4 2.8-3.3 4.6-1.6 2.4 2.1 4.5 6.9 5.6 12"/>
    <!-- 右耳：收尾带一个小勾，呼应名字里的 J -->
    <path d="M40.2 31.2c2.7-6.2 4.2-11.8 3.4-15.1-.6-2.4-3-3.1-4.7-1.3-2.3 2.3-4.2 7-5.1 12.2"/>
  </g>

  <!-- 头：填底色，让耳朵看起来在头后面 -->
  <path
    d="M32 25.6c7.4 0 12.7 5.6 12.7 12.6 0 7.6-5.6 12.9-12.7 12.9s-12.7-5.3-12.7-12.9c0-7 5.3-12.6 12.7-12.6Z"
    fill="url(#rj-bg)"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- 眼睛：两个圆点，一点表情就够，别画太细 -->
  <circle cx="27.2" cy="39.4" r="1.9" fill="#ffffff"/>
  <circle cx="36.8" cy="39.4" r="1.9" fill="#ffffff"/>

  <!-- 鼻子：一个小三角，保持线条风格 -->
  <path d="M32 42.6l1.5 1.8h-3z" fill="#ffffff"/>

  <!-- 胡须：两短笔，远看是兔子，近看是线条 -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <path d="M22.6 44.2l-4 1.2"/>
    <path d="M41.4 44.2l4 1.2"/>
  </g>
</svg>
