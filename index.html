<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-rabbit.svg" />
    <link rel="apple-touch-icon" href="/logo-rabbit.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> -->
    <title>rabbitJ · 一个地址接入主流大模型</title>
    <!--
      在样式加载前先把主题打到 <html> 上，避免刷新时「先白闪一下再变黑」。
      逻辑和 src/store/theme.ts 保持一致：读本地选择，没选过就跟随系统。
    -->
    <script>
      ;(function () {
        try {
          var mode = 'system'
          var raw = localStorage.getItem('theme_storage')
          if (raw) {
            var parsed = JSON.parse(raw)
            mode = (parsed && parsed.state && parsed.state.mode) || 'system'
          }
          var dark =
            mode === 'dark' ||
            ((mode === 'system' || !mode) &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          document.documentElement.className = dark ? 'dark' : 'light'
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* 隐私模式下读不到，按浅色继续 */
        }
      })()
    </script>
  </head>
  <body>
    <script type="module" src="/src/main.tsx"></script>
    <div id="root"></div> 
  </body>
</html>
